<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Aarushi Journal"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Aarushi's Cricket Journal</title>
<style>
:root{--navy:#10243a;--navy2:#183653;--lime:#c9f36a;--sky:#eaf2f8;--ink:#172b40;--muted:#6c7c8c;--line:#dce5ec;--white:#fff;--green:#23865b;--red:#b94b4b;--amber:#a66a13;--shadow:0 8px 28px rgba(16,36,58,.09)}*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto}.top{background:linear-gradient(125deg,var(--navy),#214a6b);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 25px 25px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:12px;letter-spacing:1.7px;font-weight:800;color:var(--lime)}.top h1{font-size:26px;margin:8px 0 3px}.sub{color:#d2dfeb;font-size:13px}.datebar{display:flex;align-items:center;gap:9px;margin-top:18px}.datebar input{background:#ffffff18;color:white;border:1px solid #ffffff44;border-radius:11px;padding:10px;color-scheme:dark}.mode{display:flex;background:#ffffff18;padding:3px;border-radius:12px}.mode button{border:0;background:transparent;color:#dbe6ef;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:700}.mode button.active{background:var(--lime);color:var(--navy)}main{padding:16px 14px;display:grid;gap:14px}.hero{background:var(--navy);color:white;border-radius:19px;padding:18px;box-shadow:var(--shadow)}.hero .eyebrow{color:var(--lime);font-size:11px;font-weight:800;letter-spacing:1.4px}.hero h2{font-size:22px;margin:7px 0}.hero p{color:#d5e0e9;font-size:13px;margin:0;line-height:1.5}.progressrow{display:flex;align-items:center;gap:12px;margin-top:16px}.track{height:9px;background:#ffffff25;border-radius:20px;overflow:hidden;flex:1}.fill{height:100%;background:var(--lime);width:0%;border-radius:20px;transition:width .2s}.pct{font-size:13px;font-weight:800;color:var(--lime);min-width:42px;text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 3px 12px #10243a08;min-width:0}.card h3{font-size:15px;margin:0 0 5px}.hint{font-size:12px;color:var(--muted);line-height:1.45}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{font-size:18px;margin:0}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:var(--sky);color:var(--navy);font-weight:800}.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #edf1f4;font-size:14px}.task:last-child{border-bottom:0}.task input{width:21px;height:21px;accent-color:var(--green);flex:none;margin:0}.task small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:12px;font-weight:800;color:#526579}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fbfcfd;border-radius:11px;padding:11px;color:var(--ink);min-height:43px}.field textarea{min-height:78px;resize:vertical}.btn{border:0;background:var(--navy);color:white;padding:11px 14px;border-radius:11px;font-weight:750;font-size:13px}.btn.lime{background:var(--lime);color:var(--navy)}.btn.light{background:var(--sky);color:var(--navy)}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:8px 10px;font-size:12px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.attendance{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statusbtn{padding:10px 7px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--muted);font-size:12px;font-weight:750}.statusbtn.selected{background:#e7f6ed;border-color:#81c79e;color:#17643d}.statusbtn.rest.selected{background:#fff4df;border-color:#e6c27e;color:#89560c}.metricgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f5f8fa;border-radius:13px;padding:13px}.metric strong{display:block;font-size:23px;color:var(--navy)}.metric span{font-size:11px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 7px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.navinner{width:min(980px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;background:transparent;color:#6b7c8d;padding:8px 3px;border-radius:12px;font-size:10px;font-weight:750}.nav button span{display:block;font-size:19px;margin-bottom:3px}.nav button.active{background:#eaf2f8;color:var(--navy)}.notice{font-size:12px;padding:11px 12px;border-radius:12px;background:#fff8e8;color:#77521a;line-height:1.5}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.barrow{display:flex;align-items:center;gap:8px;margin:9px 0}.barlabel{width:72px;font-size:11px;color:var(--muted)}.barbg{flex:1;background:#edf1f4;border-radius:20px;height:9px;overflow:hidden}.barval{height:100%;background:#4e8ab5;border-radius:20px}.barcount{width:28px;text-align:right;font-size:11px;font-weight:800}.hidden{display:none!important}.footer{text-align:center;color:#8a98a5;font-size:10px;padding:8px 0 18px}.goalitem{border:1px solid var(--line);padding:11px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:8px}.goalitem.done{background:#f0f8f2}.tag{font-size:10px;font-weight:800;border-radius:20px;padding:4px 7px;background:#edf3f8;color:#35516a;white-space:nowrap}
@media(min-width:700px){main{padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:22px}.top{padding-left:26px;padding-right:26px}}
</style></head>
<body><div class="app">
<header class="top"><div class="topline"><div><div class="brand">TEAM AARUSHI · ATHLETE JOURNAL</div><h1 id="greeting">Ready for your day?</h1><div class="sub">My training. My responsibility. My progress.</div></div><div class="mode"><button id="athleteMode" class="active" onclick="setMode('athlete')">ATHLETE</button><button id="parentMode" onclick="setMode('parent')">PARENT</button></div></div><div class="datebar"><label for="datePick" class="sub">DATE</label><input id="datePick" type="date" aria-label="Choose date"><button class="btn small lime" onclick="goToday()">Today</button></div></header>
<main id="view"></main><div class="footer">Aarushi's Cricket Journal · Your journey, your ownership.</div></div>
<nav class="nav"><div class="navinner"><button data-tab="today" class="active" onclick="showTab('today')"><span>☀️</span>Today</button><button data-tab="attendance" onclick="showTab('attendance')"><span>📅</span>Attendance</button><button data-tab="goals" onclick="showTab('goals')"><span>🎯</span>Goals</button><button data-tab="parent" onclick="showTab('parent')"><span>📊</span>Progress</button></div></nav>
<script>
const KEY='aarushi-journal-v1';
const routine=[['Wake up and get ready','I manage my morning'],['Brush, wash and dress','I get myself ready'],['Eat breakfast / planned snack','Fuel my body'],['Fill my water bottle','Stay hydrated'],['Check today’s training plan','Know where I need to be']];
const kit=[['Bat',''],['Batting gloves',''],['Batting pads',''],['Helmet',''],['Thigh guard and abdominal guard',''],['Cricket shoes and socks',''],['Water bottle',''],['Towel and spare clothes',''],['Check kit bag and close every zip','']];
let db=load(), currentDate=localDate(), tab='today', mode='athlete';
function localDate(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{days:{},goals:[],settings:{}}}catch(e){return {days:{},goals:[],settings:{}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function day(d=currentDate){if(!db.days[d])db.days[d]={routine:{},kit:{},attendance:{cricket:'not-planned',tennis:'not-planned'},goal:'',reflection:{proud:'',learned:'',next:''},recovery:{sleep:'',water:'',energy:'',notes:''},notes:''};return db.days[d]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setMode(m){mode=m;document.getElementById('athleteMode').classList.toggle('active',m==='athlete');document.getElementById('parentMode').classList.toggle('active',m==='parent');tab=m==='parent'?'parent':(tab==='parent'?'today':tab);render()}
function showTab(t){tab=t;mode=t==='parent'?'parent':'athlete';document.getElementById('athleteMode').classList.toggle('active',mode==='athlete');document.getElementById('parentMode').classList.toggle('active',mode==='parent');render()}
function goToday(){currentDate=localDate();document.getElementById('datePick').value=currentDate;render()}
document.getElementById('datePick').value=currentDate;document.getElementById('datePick').addEventListener('change',e=>{currentDate=e.target.value||localDate();render()});
function setCheck(group,key,val){day()[group][key]=val;save();render()}
function checkList(title,items,group,desc){let d=day(),done=items.filter((x,i)=>d[group][i]).length;return `<section class="card"><div class="sectionhead"><div><h3>${title}</h3><div class="hint">${desc||'Tick each item when you have done it.'}</div></div><span class="pill">${done}/${items.length}</span></div>${items.map((x,i)=>`<label class="task"><input type="checkbox" ${d[group][i]?'checked':''} onchange="setCheck('${group}',${i},this.checked)"><span>${esc(Array.isArray(x)?x[0]:x)}${Array.isArray(x)&&x[1]?`<small>${esc(x[1])}</small>`:''}</span></label>`).join('')}</section>`}
function attendanceCard(sport){let val=day().attendance[sport];let opts=[['attended','Attended'],['absent','Absent'],['rest','Rest day'],['not-planned','Not planned']];return `<section class="card"><div class="sectionhead"><h3>${sport==='cricket'?'🏏 Cricket':'🎾 Tennis'}</h3><span class="pill">Attendance</span></div><div class="attendance">${opts.map(([v,l])=>`<button class="statusbtn ${v==='rest'?'rest':''} ${val===v?'selected':''}" onclick="setAttendance('${sport}','${v}')">${l}</button>`).join('')}</div></section>`}
function setAttendance(s,v){day().attendance[s]=v;save();render()}
function update(path,val){let [a,b]=path.split('.');day()[a][b]=val;save()}
function todayView(){let d=day(),rDone=routine.filter((x,i)=>d.routine[i]).length,kDone=kit.filter((x,i)=>d.kit[i]).length,total=routine.length+kit.length,done=rDone+kDone;return `<section class="hero"><div class="eyebrow">YOUR DAILY MISSION</div><h2>Bring your energy. Own your preparation.</h2><p>Small responsibilities build a strong athlete. Do your best, learn something and enjoy your training.</p><div class="progressrow"><div class="track"><div class="fill" style="width:${Math.round(done/total*100)}%"></div></div><div class="pct">${Math.round(done/total*100)}%</div></div><div class="hint" style="color:#d5e0e9;margin-top:7px">${done} of ${total} preparation tasks completed</div></section><div class="grid">${attendanceCard('cricket')}${attendanceCard('tennis')}</div>${checkList('🌅 My routine',routine,'routine','My morning and training-day responsibilities')}${checkList('🎒 My kit checklist',kit,'kit','Pack the evening before. Check it yourself before leaving.')}<section class="card"><div class="sectionhead"><h3>🎯 Today's training goal</h3><span class="pill">One focus</span></div><div class="field"><label for="dailyGoal">What do I want to work on?</label><select id="dailyGoal" onchange="day().goal=this.value;save()"><option value="">Choose a focus</option>${['Watch the ball and judge its length','Keep my front shoulder towards the ball','Improve my cover drive','Work on my straight drive','Improve my pull shot','Make better decisions against spin','Improve my left-arm spin control','Be proactive in the field','Communicate and support my team','My own goal'].map(x=>`<option ${d.goal===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="customGoal">Or write my own goal</label><input id="customGoal" placeholder="My personal goal..." value="${esc(d.goal&&!['Watch the ball and judge its length','Keep my front shoulder towards the ball','Improve my cover drive','Work on my straight drive','Improve my pull shot','Make better decisions against spin','Improve my left-arm spin control','Be proactive in the field','Communicate and support my team','My own goal'].includes(d.goal)?d.goal:'')}" oninput="day().goal=this.value;save()"></div></section><section class="card"><div class="sectionhead"><h3>💧 Recovery check</h3><span class="pill">Look after yourself</span></div><div class="grid"><div class="field"><label>Hours of sleep</label><input type="number" min="0" max="24" step="0.5" placeholder="e.g. 9" value="${esc(d.recovery.sleep)}" onchange="update('recovery.sleep',this.value)"></div><div class="field"><label>Water bottles / cups</label><input type="number" min="0" max="30" placeholder="Count" value="${esc(d.recovery.water)}" onchange="update('recovery.water',this.value)"></div></div><div class="field"><label>How is my energy today?</label><select onchange="update('recovery.energy',this.value)"><option value="">Choose one</option>${['Great','Good','Okay','Tired','Need rest'].map(x=>`<option ${d.recovery.energy===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Any soreness, pain or something to tell a parent?</label><textarea placeholder="Tell a parent if something hurts or feels unusual..." onchange="update('recovery.notes',this.value)">${esc(d.recovery.notes)}</textarea></div></section><section class="card"><div class="sectionhead"><h3>⭐ My reflection</h3><span class="pill">A few words are enough</span></div>${[['proud','What am I proud of today?'],['learned','What did I learn or notice?'],['next','What would I like to try next time?']].map(([k,l])=>`<div class="field"><label>${l}</label><textarea placeholder="${l}" onchange="update('reflection.${k}',this.value)">${esc(d.reflection[k])}</textarea></div>`).join('')}</section>`}
function attendanceView(){
 let days=Object.entries(db.days).sort((a,b)=>b[0].localeCompare(a[0]));
 let records=days.filter(([dt,v])=>v.attendance.cricket!=='not-planned'||v.attendance.tennis!=='not-planned');
 let count=(sport,status)=>records.filter(([dt,x])=>x.attendance[sport]===status).length;
 let rows=records.length?records.map(([dt,v])=>{
   let dateText=new Date(dt+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
   return `<div class="goalitem"><div><strong>${dateText}</strong><div class="hint">Cricket: ${label(v.attendance.cricket)} · Tennis: ${label(v.attendance.tennis)}</div></div><button class="btn small light" onclick="currentDate='${dt}';document.getElementById('datePick').value=currentDate;showTab('today')">Open</button></div>`;
 }).join(''):`<div class="empty">No attendance recorded yet. Start by marking today's activities.</div>`;
 return `<section class="card"><div class="sectionhead"><h2>Attendance history</h2><span class="pill">All recorded days</span></div><div class="metricgrid"><div class="metric"><strong>${count('cricket','attended')}</strong><span>Cricket sessions attended</span></div><div class="metric"><strong>${count('tennis','attended')}</strong><span>Tennis sessions attended</span></div><div class="metric"><strong>${count('cricket','absent')}</strong><span>Cricket absences</span></div><div class="metric"><strong>${count('tennis','absent')}</strong><span>Tennis absences</span></div></div><div class="notice" style="margin-top:12px">Rest days and days marked “Not planned” are not counted as absences. Record attendance on the date it happened.</div></section><section class="card"><div class="sectionhead"><h3>Daily attendance log</h3><span class="pill">Select a date above</span></div>${rows}</section>`;
}
function label(v){return ({attended:'Attended',absent:'Absent',rest:'Rest', 'not-planned':'Not planned'})[v]||v}
function goalsView(){return `<section class="card"><div class="sectionhead"><h2>My goals</h2><span class="pill">Small steps count</span></div><div class="field"><label for="goalText">Add a goal</label><input id="goalText" placeholder="e.g. Improve my length judgement"><select id="goalArea"><option>Batting</option><option>Bowling</option><option>Fielding</option><option>Fitness</option><option>Teamwork</option><option>Independence</option></select><button class="btn" onclick="addGoal()">＋ Add my goal</button></div>${db.goals.length?db.goals.map((g,i)=>`<div class="goalitem ${g.done?'done':''}"><label style="display:flex;gap:9px;align-items:flex-start;flex:1"><input type="checkbox" ${g.done?'checked':''} onchange="toggleGoal(${i},this.checked)" style="width:20px;height:20px;accent-color:#23865b"><span><strong>${esc(g.text)}</strong><small class="hint" style="display:block">${esc(g.area)} · Added ${esc(g.created)}</small></span></label><button class="btn small danger" onclick="deleteGoal(${i})">Remove</button></div>`).join(''):'<div class="empty">Your goals will appear here. Choose one small thing to improve.</div>'}</section><section class="card"><h3>Today's focus</h3><p class="hint">Your daily goal is saved in the Today tab. Keep it realistic and ask your coach for help when needed.</p><button class="btn light" onclick="showTab('today')">Go to today</button></section>`}
function addGoal(){let t=document.getElementById('goalText').value.trim();if(!t)return;db.goals.push({text:t,area:document.getElementById('goalArea').value,done:false,created:currentDate});save();render()}
function toggleGoal(i,v){db.goals[i].done=v;save();render()};function deleteGoal(i){if(confirm('Remove this goal?')){db.goals.splice(i,1);save();render()}}
function parentView(){let entries=Object.entries(db.days).sort((a,b)=>b[0].localeCompare(a[0]));let month=currentDate.slice(0,7),monthEntries=entries.filter(([d])=>d.startsWith(month));let attended=(s,arr)=>arr.filter(([d,x])=>x.attendance[s]==='attended').length;let totalRoutine=entries.reduce((n,[d,x])=>n+routine.filter((t,i)=>x.routine[i]).length,0);let totalKit=entries.reduce((n,[d,x])=>n+kit.filter((t,i)=>x.kit[i]).length,0);let totalChecks=entries.reduce((n,[d,x])=>n+routine.length+kit.length,0);let completion=totalChecks?Math.round((totalRoutine+totalKit)/totalChecks*100):0;return `<section class="hero"><div class="eyebrow">PARENT DASHBOARD</div><h2>Progress through consistency.</h2><p>Review patterns, support her independence and celebrate learning. This is a coaching conversation, not a scorecard.</p></section><section class="card"><div class="sectionhead"><h3>This month · ${new Date(currentDate+'T12:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><span class="pill">${monthEntries.length} recorded days</span></div><div class="metricgrid"><div class="metric"><strong>${attended('cricket',monthEntries)}</strong><span>Cricket sessions attended</span></div><div class="metric"><strong>${attended('tennis',monthEntries)}</strong><span>Tennis sessions attended</span></div><div class="metric"><strong>${completion}%</strong><span>Recorded checklist completion</span></div><div class="metric"><strong>${db.goals.filter(g=>g.done).length}/${db.goals.length}</strong><span>Goals completed</span></div></div></section><section class="card"><h3>Training attendance overview</h3>${['cricket','tennis'].map(s=>{let a=attended(s,entries),abs=entries.filter(([d,x])=>x.attendance[s]==='absent').length,rest=entries.filter(([d,x])=>x.attendance[s]==='rest').length;return `<div style="margin:14px 0"><strong style="text-transform:capitalize">${s}</strong><div class="hint">${a} attended · ${abs} absent · ${rest} rest days</div></div>`}).join('')}</section><section class="card"><h3>Recent reflections</h3>${entries.filter(([d,x])=>x.reflection.proud||x.reflection.learned||x.reflection.next).slice(0,7).map(([d,x])=>`<div class="goalitem"><div><strong>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}</strong><div class="hint">${esc(x.reflection.proud||x.reflection.learned||'Reflection recorded')}</div></div><button class="btn small light" onclick="currentDate='${d}';document.getElementById('datePick').value=currentDate;showTab('today')">Review</button></div>`).join('')||'<div class="empty">Reflections will appear here when Aarushi records them.</div>'}</section><section class="card"><div class="sectionhead"><h3>Family data & backups</h3><span class="pill">This device</span></div><p class="hint">Export a backup regularly. To use another device, import the same backup there. Automatic multi-device sync is not enabled in this offline-first version.</p><div class="btnrow"><button class="btn" onclick="exportData()">↓ Export backup</button><button class="btn light" onclick="document.getElementById('importFile').click()">↑ Import backup</button><button class="btn light" onclick="exportCSV()">Export attendance CSV</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><div class="notice" style="margin-top:12px">Parent view is shared with Aarushi on this iPad. Keep the iPad passcode private if you want to protect family records.</div></section><section class="card"><h3>Data controls</h3><p class="hint">All entries are stored in this browser on this device. Clearing Safari website data or removing the app may erase records, so export backups periodically.</p><button class="btn danger small" onclick="clearData()">Delete all journal data</button></section>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aarushi-journal-backup-'+localDate()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.days||!Array.isArray(x.goals))throw Error('Invalid backup');if(!confirm('Import backup? Existing journal data will be replaced.'))return;db=x;save();render();alert('Backup imported successfully.')}catch(err){alert('Could not import this file. Please choose an Aarushi Journal backup.')}};r.readAsText(f);e.target.value=''}
function exportCSV(){let rows=[['Date','Cricket','Tennis','Goal','Sleep hours','Energy','Proud of','Learned','Next time']];Object.entries(db.days).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([d,x])=>rows.push([d,label(x.attendance.cricket),label(x.attendance.tennis),x.goal,x.recovery.sleep,x.recovery.energy,x.reflection.proud,x.reflection.learned,x.reflection.next]));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='aarushi-attendance-'+localDate()+'.csv';a.click();URL.revokeObjectURL(a.href)}
function clearData(){if(confirm('Delete ALL journal entries and goals from this device? Export a backup first if you want to keep them.')){db={days:{},goals:[],settings:{}};save();render()}}
function render(){document.getElementById('greeting').textContent=mode==='parent'?'Team Aarushi · Parent view':'Ready for your day, Aarushi?';document.getElementById('datePick').value=currentDate;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let el=document.getElementById('view');el.innerHTML=tab==='today'?todayView():tab==='attendance'?attendanceView():tab==='goals'?goalsView():parentView();}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
